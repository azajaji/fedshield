name: smoke
seed: 42
device: auto
out_dir: ./results
log_every: 1
data:
  name: ciciomt
  root: ./data
  num_clients: 4
  use_synthetic_fallback: true
  batch_size_choices: [64]
model:
  arch: iomt_mlp
  num_classes: 6
  ae_bottleneck: 16
attack:
  malicious_ratio: 0.0
  types: []
  backdoor_target: 0
defense:
  name: fedavg
federated:
  rounds: 2
  sample_ratio: 1.0
  local_epochs_choices: [1]
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
